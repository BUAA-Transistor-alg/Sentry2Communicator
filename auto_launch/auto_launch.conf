# =============================================================================
# auto_launch/auto_launch.conf — 串口通信服务端自启动/看门狗配置
#
# auto_launch/watchdog.py        读 [launch] + [watchdog]（看门狗本体，也可 --run 直接跑）
# auto_launch/install_service.py 读 [launch] + [watchdog] + [service]（安装 systemd 服务）
#
# 与 UnifiedAutoAimPipeline 的 auto_launch 同时运行时互不冲突:
#   共享内存     /s2c_serial_comm（对方: SysV shm + /uap_infer_req_* /uap_infer_resp_* 具名信号量）
#   看门狗套接字 /tmp/s2c_serial_comm_watchdog.sock（对方: /tmp/unified_auto_aim_watchdog.sock）
#   服务名       s2c_serial_comm.service（对方: unified_auto_aim.service）
#
# 语法：INI。'#' 或 ';' 开头为注释；值不要加引号；多行值用缩进的续行。
# =============================================================================

[launch]
# 在 project_root 下、用 shell -c 执行的命令行
command = ./build/s2c_serial_comm_server

# 启动前先执行的 shell 片段（多行逐行执行；留空表示不执行）
preamble =

# 执行 command 用的 shell（绝对路径）
shell = /bin/bash

# 项目根目录：相对本文件（auto_launch/）所在目录解析，默认 ".." 即项目根
project_root = ..

# 子进程退出后的重启策略：always（任何退出都重启）/ unexpected（仅异常退出重启）
restart_policy = always

[watchdog]
# ── 判定存活 ──
# 心跳由主程序的 WatchdogFeed 经下面这个 Unix 域套接字上报；
# 超过 feed_timeout_sec 没收到就判定卡死并重启整个进程组。
heartbeat_enabled = true
socket_path = /tmp/s2c_serial_comm_watchdog.sock
feed_timeout_sec = 20            # 喂狗超时（秒）
connect_timeout_sec = 30         # 启动后等待首次喂狗的最长时间（秒）

# ── 生命周期 ──
shutdown_grace_sec = 5           # 先发 SIGINT，超过该时长仍未退出则对进程组 SIGKILL
restart_delay_sec = 3            # 重启前的等待
restart_backoff_max_sec = 30     # 连续快速失败时退避上限（每失败一次翻倍）
healthy_run_sec = 30             # 连续运行超过该时长即认为稳定，退避计数清零
max_restarts = 0                 # 0 = 无限重启；>0 时达到次数后退出（调试用）

# ── 传给主程序的喂狗参数（环境变量 WATCHDOG_*，含义见 include/common/Debug/WatchdogFeed.h）──
feed_period_ms = 500             # 上报周期
stall_timeout_ms = 10000         # 连续该时长没有新帧（tick）就停止喂狗（<=0 关闭帧门控）
boot_grace_ms = 10000            # 从 WatchdogFeed::start() 到第一帧的最长允许时间，超时则停止喂狗（<=0 不限制）

# ── 日志 ──
log_file = logs/watchdog.log     # 相对项目根；留空 = 只输出到 stdout（systemd 记入 journal）
log_max_bytes = 5242880          # 超过该大小轮转一次为 watchdog.log.1
log_level = info                 # debug | info | warn | error
status_log_sec = 10              # 周期性状态日志间隔（<=0 关闭）

[service]
# systemd 服务名与描述
name = s2c_serial_comm.service
description = Sentry2 Serial Communication Server (auto_launch watchdog)
# 额外依赖（可留空）
after = network-online.target
wants = network-online.target
# 服务进程环境变量（多行各占一行，KEY=VALUE）
environment = PYTHONUNBUFFERED=1
restart_sec = 3                  # systemd RestartSec（看门狗自身异常退出后的重启间隔）
timeout_stop_sec = 20            # systemd 停止服务时的宽限（要大于 shutdown_grace_sec）
